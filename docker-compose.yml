version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eventmedia-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventmedia

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: eventmedia-backend

    dns:
      - 8.8.8.8
      - 8.8.4.4

    env_file:
      - ./backend/.env

    ports:
      - "5001:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    command: sh -c "npx prisma generate && npx prisma migrate deploy && node prisma/seed.js && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: eventmedia-frontend

    env_file:
      - ./frontend/.env

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5001

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads: