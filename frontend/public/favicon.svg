<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="5" y="11" width="22" height="15" rx="3" fill="white"/>
  <!-- Camera lens outer -->
  <circle cx="16" cy="18.5" r="5" fill="url(#bg)"/>
  <!-- Camera lens inner -->
  <circle cx="16" cy="18.5" r="3" fill="white" opacity="0.9"/>
  <!-- Camera notch (top) -->
  <path d="M12 11 L14 8 H18 L20 11" fill="white"/>
  <!-- Flash dot -->
  <circle cx="23" cy="13.5" r="1.2" fill="url(#bg)"/>
</svg>
